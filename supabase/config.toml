project_id = "kjazrljlfreczicstymr"

# Everything not listed below keeps Supabase's default verify_jwt = true, which
# is what makes the Edge Functions a safe replacement for the old server
# functions: the gateway rejects anonymous calls before our code runs.

# Receives drafts from the News Creator Plus app; authenticated by its own
# x-plus-secret header, not by a Supabase session.
[functions.ingest-plus-draft]
verify_jwt = false

# Invoked by pg_cron inside the database, which carries no user JWT.
[functions.publish-scheduled]
verify_jwt = false

# Fired by anonymous visitors (newsletter signup, pending comments, widget
# forms). It only re-reads existing rows and emails the admin, so it was always
# a public endpoint; input is zod-validated inside.
[functions.send-admin-notification]
verify_jwt = false

# Returns the public PayPal client id to the course landing page before login.
[functions.paypal-config]
verify_jwt = false

# Crawler-facing endpoints kept alive only until DNS cuts over to GitHub Pages;
# after cutover the static build serves these and they can be deleted.
[functions.sitemap]
verify_jwt = false

[functions.news-sitemap]
verify_jwt = false

[functions.og-meta]
verify_jwt = false

[functions.ssr-article]
verify_jwt = false

[functions.ssr-home]
verify_jwt = false

# The global hi-tech ingest pair. Invoked by pg_cron (no user JWT) and by an
# admin from the panel; both functions check INGEST_CRON_SECRET or an admin role
# themselves before doing any work.
[functions.ingest-global-tech]
verify_jwt = false

[functions.ingest-worker]
verify_jwt = false

# The daily cron submits sitemaps with the shared secret; the function itself
# authorizes cron-or-admin before doing anything.
[functions.submit-sitemap]
verify_jwt = false

# The unsubscribe link in newsletter emails is clicked by anonymous readers;
# the subscriber's own row id is the credential.
[functions.newsletter-unsubscribe]
verify_jwt = false

# Callable by future social automation with the shared secret; the function
# itself authorizes cron-or-admin.
[functions.generate-social-post]
verify_jwt = false

# The auto-publish cron carries the shared secret; the function authorizes
# cron-or-admin.
[functions.social-publish]
verify_jwt = false

# Admin-only "כתבה שיווקית" generator; authorizes cron-or-admin internally so
# server-side maintenance calls with the shared secret also work.
[functions.marketing-article]
verify_jwt = false

# Fired by the publish DB trigger with the shared secret; pings Google's
# Indexing API for a freshly-published article.
[functions.index-article]
verify_jwt = false

# Called by social-publish with the shared secret to render one branded image
# per worker; authorizes cron-or-admin internally.
[functions.social-image]
verify_jwt = false
